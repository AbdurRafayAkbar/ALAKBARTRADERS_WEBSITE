name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same PostgreSQL major version as dev and production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alakbar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: alakbartraders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alakbar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values; this database only lives for the length of the job.
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://alakbar:ci-only-password@localhost:5432/alakbartraders

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Django system checks
        run: uv run python manage.py check

      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest
